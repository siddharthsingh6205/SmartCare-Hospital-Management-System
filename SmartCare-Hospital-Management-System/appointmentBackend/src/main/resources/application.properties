spring.application.name=appointmentBackend

spring.datasource.url=${DATASOURCE_URL:jdbc:h2:mem:appointmentdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATASOURCE_USER:sa}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
frontend.user.url=${FRONTEND_URL1:http://localhost:3000}
frontend.admin.url=${FRONTEND_URL2:http://localhost:3000}
server.port=8080
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.mail.username=jeyarubanjenushan3@gmail.com
stripe.api.key=${STRIPE_API_KEY:dummy}

